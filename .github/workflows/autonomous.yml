name: Advance Living World
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/simulation/**'
      - 'scripts/tick-life.mjs'
      - '.github/workflows/autonomous.yml'
permissions:
  contents: read
concurrency:
  group: living-world
  cancel-in-progress: false
jobs:
  advance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.save.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify engine and legacy world
        run: npm test
      - name: Advance persisted actions
        run: npm run world:tick
      - name: Validate new state
        run: node scripts/check-life.mjs
      - name: Save performed action history
        id: save
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/life.json public/life/
          if ! git diff --cached --quiet; then
            git commit -m "world: advance autonomous resident actions"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: advance
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.advance.outputs.sha }}
    secrets: inherit
